function art(t){return (t.cover||t.coverUri)?'<img src="'+(t.cover||t.coverUri)+'" alt="">':'<div class="art" style="--a:'+t.colors[0]+';--b:'+t.colors[1]+'"><span>♫</span></div>'}
function updateStack(direction=0){const stack=$('#stack'),old=stack.querySelector('.front');if(old&&direction){old.classList.add(direction>0?'out-left':'out-right');old.classList.remove('front');setTimeout(()=>old.remove(),560)}else stack.innerHTML='';
const idx=index();const next=[order[(idx+2)%order.length],order[(idx+1)%order.length],current];for(let n=0;n<next.length;n++){const t=track(next[n]);const el=document.createElement('div');el.className='album '+(n===0?'back2':n===1?'back1':'front');el.dataset.id=t.id;el.innerHTML=art(t);if(n===2){el.style.transform=direction?'translateY(-9%) scale(.95)':'';requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.transform=''))}stack.insertBefore(el,stack.firstChild)}
$('#title').textContent=track().artist+' - '+track().title;$('#duration').textContent=fmt(track().duration);$('#screen').style.setProperty('--glow',track().colors[0]);$('#favorite').classList.toggle('liked',favorites.has(current));renderQueue();setTimeout(()=>transitioning=false,570)}
function fmt(s){return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function choose(id,direction=1){if(transitioning||id===current)return;transitioning=true;const was=playing;current=id;demoTime=0;audio.pause();if(window.AndroidBridge&&track().uri){window.AndroidBridge.playTrack(track().uri,track().title,track().artist);playing=true;}if(track().url){audio.src=track().url;audio.load();if(was)audio.play().catch(()=>{});}else{audio.removeAttribute('src');audio.load()}playing=was;updatePlay();updateStack(direction)}
function next(){if(order.length<2)return;history.push(current);let id;if(shuffle){const candidates=order.filter(x=>x!==current);id=candidates[Math.floor(Math.random()*candidates.length)]}else{id=order[(index()+1)%order.length]}choose(id,1)}
function prev(){if(order.length<2)return;const id=history.length?history.pop():order[(index()-1+order.length)%order.length];choose(id,-1)}
function updatePlay(){$('#play').innerHTML=playing?'<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 4 Q7 3 9 4 L20 11 Q22 12 20 13 L9 20 Q7 21 7 19Z"/></svg>'}
$('#play').onclick=()=>{playing=!playing;if(window.AndroidBridge)window.AndroidBridge.setPlaying(playing);if(track().url){if(playing)audio.play().catch(()=>{playing=false;updatePlay();toast('Не удалось воспроизвести')});else audio.pause()}else if(playing)toast('Демо без звука. Добавь свои MP3 через очередь');updatePlay()};
$('#shuffle').onclick=()=>{shuffle=!shuffle;$('#shuffle').classList.toggle('shuffle-on',shuffle);toast(shuffle?'Случайный порядок включён':'Обычный порядок')};
$('#favorite').onclick=()=>{if(favorites.has(current))favorites.delete(current);else favorites.add(current);localStorage.setItem('tg-favorites',JSON.stringify([...favorites]));$('#favorite').classList.toggle('liked',favorites.has(current));toast(favorites.has(current)?'Добавлено в «Избранное»':'Удалено из «Избранного»')};
$('#device').onclick=()=>toast('Воспроизведение на этом устройстве');
$('#queueOpen').onclick=()=>$('#overlay').classList.add('open');$('#close').onclick=()=>$('#overlay').classList.remove('open');$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('open')});
function renderQueue(){const list=$('#queueList');list.innerHTML='';for(const id of order){const t=track(id),el=document.createElement('div');el.className='queue-item';el.dataset.id=id;el.innerHTML='<div class="queue-cover">'+art(t)+'</div><div class="queue-label"><strong>'+esc(t.artist+' — '+t.title)+'</strong><small>'+(id===current?'Сейчас играет · ':'')+fmt(t.duration)+'</small></div><span class="handle" title="Перетащить">≡</span>';el.querySelector('.queue-label').onclick=()=>{choose(id,1);$('#overlay').classList.remove('open')};list.append(el)}$('#queueCount').textContent='Треков: '+order.length}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let startX=0,startY=0,active=false;$('#stack').addEventListener('pointerdown',e=>{if(transitioning)return;startX=e.clientX;startY=e.clientY;active=true;$('#stack').setPointerCapture(e.pointerId)});$('#stack').addEventListener('pointermove',e=>{if(!active)return;let dx=e.clientX-startX,dy=e.clientY-startY;if(Math.abs(dx)>Math.abs(dy)*1.15){const f=$('#stack .front');if(f){f.classList.add('dragging');f.style.transform='translateX('+dx*.72+'px) rotate('+dx*.025+'deg)'}}});$('#stack').addEventListener('pointerup',e=>{if(!active)return;active=false;const dx=e.clientX-startX,dy=e.clientY-startY;const f=$('#stack .front');if(f){f.classList.remove('dragging');f.style.transform=''}if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.1){if(dx<0)next();else prev()}});$('#stack').addEventListener('pointercancel',()=>{active=false;const f=$('#stack .front');if(f){f.classList.remove('dragging');f.style.transform=''}});
document.addEventListener('keydown',e=>{if($('#overlay').classList.contains('open'))return;if(e.key==='ArrowLeft')next();if(e.key==='ArrowRight')prev();if(e.key===' ') {e.preventDefault();$('#play').click()}});
let moving=null,hover=null;const q=$('#queueList');
q.addEventListener('pointerdown',e=>{const handle=e.target.closest('.handle');if(!handle)return;const item=handle.closest('.queue-item');moving={id:Number(item.dataset.id),pointer:e.pointerId,item};item.classList.add('dragging');handle.setPointerCapture(e.pointerId);e.preventDefault()});
q.addEventListener('pointermove',e=>{if(!moving)return;const els=[...q.querySelectorAll('.queue-item')];let closest=null,min=Infinity;for(const el of els){if(el===moving.item)continue;const r=el.getBoundingClientRect(),dist=Math.abs(e.clientY-(r.top+r.height/2));if(dist<min){min=dist;closest=el}}els.forEach(el=>el.style.background='');if(closest){closest.style.background='#a39a8044';hover=Number(closest.dataset.id)}});
function endDrag(){if(!moving)return;moving.item.classList.remove('dragging');if(hover!==null&&hover!==moving.id){const from=order.indexOf(moving.id),to=order.indexOf(hover);order.splice(from,1);order.splice(to,0,moving.id);toast('Очередь обновлена')}moving=null;hover=null;renderQueue()}
q.addEventListener('pointerup',endDrag);q.addEventListener('pointercancel',endDrag);
$('#add').onclick=()=>$('#files').click();
async function readID3(file){
 const meta={};try{
 const buf=await file.slice(0,Math.min(file.size,5*1024*1024)).arrayBuffer(),a=new Uint8Array(buf);
 if(String.fromCharCode(...a.slice(0,3))!=='ID3')return meta;
 const ver=a[3],sizeAt=(o)=>((a[o]&127)<<21)|((a[o+1]&127)<<14)|((a[o+2]&127)<<7)|(a[o+3]&127);
 const end=Math.min(a.length,10+sizeAt(6));let p=10;
 const decode=(bytes,enc)=>{try{return new TextDecoder(enc===0?'windows-1252':enc===1?'utf-16':enc===2?'utf-16be':'utf-8').decode(bytes).replace(/\0/g,'').replace(/^\uFEFF/,'').trim()}catch{return ''}};
 while(p+10<=end){const id=String.fromCharCode(...a.slice(p,p+4));if(!/^[A-Z0-9]{4}$/.test(id))break;
 const n=ver===4?sizeAt(p+4):((a[p+4]<<24)|(a[p+5]<<16)|(a[p+6]<<8)|a[p+7]);if(!n||p+10+n>end)break;
 const b=a.slice(p+10,p+10+n);
 if(['TIT2','TPE1','TALB'].includes(id))meta[{TIT2:'title',TPE1:'artist',TALB:'album'}[id]]=decode(b.slice(1),b[0]);
 if(id==='APIC'&&b.length>10){let i=1;while(i<b.length&&b[i])i++;const mime=decode(b.slice(1,i),0)||'image/jpeg';i+=2;if(b[0]===0||b[0]===3){while(i<b.length&&b[i])i++;i++}else{while(i+1<b.length&&(b[i]||b[i+1]))i+=2;i+=2}if(i<b.length)meta.cover=URL.createObjectURL(new Blob([b.slice(i)],{type:mime}))}
 p+=10+n;
 }
 }catch(err){console.warn('ID3 metadata read failed',err)}return meta;
}
$('#files').onchange=async e=>{const files=[...e.target.files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|flac|ogg)$/i.test(f.name));for(const file of files){const id=Math.max(...tracks.map(t=>t.id))+1;const name=file.name.replace(/\.[^.]+$/,'');const parts=name.split(/\s+[-–—]\s+/);const fallbackArtist=parts.length>1?parts.shift():'Моя музыка',fallbackTitle=parts.length?parts.join(' — '):name;const url=URL.createObjectURL(file);const meta=await readID3(file);tracks.push({id,title:meta.title||fallbackTitle,artist:meta.artist||fallbackArtist,album:meta.album||'',cover:meta.cover||'',duration:210,colors:['#a48ca5','#918e78'],url});order.push(id);const probe=document.createElement('audio');probe.preload='metadata';probe.src=url;probe.onloadedmetadata=()=>{tracks.find(t=>t.id===id).duration=Number.isFinite(probe.duration)?probe.duration:210;renderQueue()}}renderQueue();toast('Добавлено файлов: '+files.length);e.target.value=''};
audio.onended=next;audio.ontimeupdate=()=>{if(Number.isFinite(audio.duration)){$('#elapsed').textContent=fmt(audio.currentTime)}};
$('#timeline').addEventListener('pointerdown',e=>{const r=e.currentTarget.getBoundingClientRect(),p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));if(track().url&&Number.isFinite(audio.duration)){audio.currentTime=p*audio.duration}else demoTime=p*track().duration});
const wave=$('#wave');let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.06);last=now;if(playing&&!track().url){demoTime+=dt;if(demoTime>=track().duration){demoTime=0;next()}}if(!track().url)$('#elapsed').textContent=fmt(demoTime);const rect=wave.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(w&&h){if(wave.width!==w||wave.height!==h){wave.width=w;wave.height=h}const c=wave.getContext('2d'),t=now*.001;c.clearRect(0,0,w,h);const bg=c.createLinearGradient(0,0,w,h);bg.addColorStop(0,'#5e5548');bg.addColorStop(1,'#51483a');c.fillStyle=bg;c.fillRect(0,0,w,h);const tmp=frame.tmp||(frame.tmp=document.createElement('canvas'));if(tmp.width!==w||tmp.height!==h){tmp.width=w;tmp.height=h}const x=tmp.getContext('2d');x.clearRect(0,0,w,h);const grad=x.createLinearGradient(0,0,w,0);grad.addColorStop(0,'#e7dac3');grad.addColorStop(.65,'#f0e6d4');grad.addColorStop(1,'#d4c9b6');x.fillStyle=grad;const p=track().url&&Number.isFinite(audio.duration)?audio.currentTime/audio.duration:demoTime/track().duration;const center=w*(.50+.04*Math.sin(t*.28)+.035*(p-.5));x.beginPath();x.moveTo(0,0);for(let y=0;y<=h;y++){let u=y/h,env=Math.pow(Math.max(0,Math.sin(Math.PI*u)),.8),wav=Math.sin(u*6.8+t*1.45)*.75+Math.sin(u*11-t*.83+.9)*.25;x.lineTo(center+h*.28*env*wav,y)}x.lineTo(0,h);x.closePath();x.fill();c.save();c.filter='blur('+Math.max(3,h*.14)+'px)';c.drawImage(tmp,0,0);c.restore();const shine=c.createLinearGradient(0,0,0,h);shine.addColorStop(0,'#ffffff50');shine.addColorStop(.28,'#ffffff03');shine.addColorStop(1,'#00000020');c.fillStyle=shine;c.fillRect(0,0,w,h)}requestAnimationFrame(frame)}

function nativeLibraryLoaded(items){
  if(!Array.isArray(items)||!items.length){toast('На телефоне пока не найдено аудиофайлов');return}
  tracks=items.map(item=>({id:Number(item.id),title:item.title||'Без названия',artist:item.artist||'Неизвестный исполнитель',album:item.album||'',duration:Number(item.duration)||0,uri:item.uri,cover:item.coverUri||'',colors:['#a48ca5','#918e78']}));
  order=tracks.map(t=>t.id);current=order[0];history=[];demoTime=0;
  renderQueue();updateStack();renderNativeLibrary();
  toast('Найдено треков: '+items.length);
}
function renderNativeLibrary(){
 const box=document.getElementById('nativeLibraryList');if(!box)return;box.innerHTML='';
 const nativeTracks=tracks.filter(t=>t.uri);
 if(!nativeTracks.length){box.innerHTML='<p style="color:#bbb">Музыка не найдена. Проверь разрешение на аудиофайлы.</p>';return}
 nativeTracks.forEach(t=>{const b=document.createElement('button');b.className='library-row';const cover=t.cover?'<img src="'+t.cover+'">':'<span class="placeholder"></span>';b.innerHTML=cover+'<span><strong>'+esc(t.artist+' — '+t.title)+'</strong><br><small style="color:#aaa">'+esc(t.album||'')+'</small></span>';b.onclick=()=>{choose(t.id,1);document.getElementById('libraryPanel').classList.remove('open')};box.appendChild(b)});
}
document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.nav-item').forEach(x=>x.classList.toggle('active',x===b));
 const tab=b.dataset.tab;
 if(tab==='Библиотека'){renderNativeLibrary();document.getElementById('libraryPanel').classList.add('open')}
 else if(tab==='Поиск'){document.getElementById('libraryPanel').classList.add('open');document.getElementById('panelHeading').textContent='Поиск';document.getElementById('nativeLibraryList').innerHTML='<input id="nativeSearch" placeholder="Исполнитель, альбом или трек" style="width:100%;padding:14px;border-radius:30px;background:#292929;color:white;border:1px solid #777"><div id="searchResults"></div>';const inp=document.getElementById('nativeSearch');inp.oninput=()=>{const q=inp.value.toLowerCase();document.getElementById('searchResults').innerHTML='';tracks.filter(t=>(t.title+' '+t.artist+' '+t.album).toLowerCase().includes(q)).forEach(t=>{const el=document.createElement('button');el.className='library-row';el.textContent=t.artist+' — '+t.title;el.onclick=()=>{choose(t.id,1);document.getElementById('libraryPanel').classList.remove('open')};document.getElementById('searchResults').append(el)})}}
 else {toast('Раздел «'+tab+'» добавим следующим этапом')}
});
document.getElementById('closeLibrary').onclick=()=>document.getElementById('libraryPanel').classList.remove('open');
if(window.AndroidBridge){window.AndroidBridge.scanLibrary();}
updateStack();updatePlay();requestAnimationFrame(frame);
</script></body></html>
